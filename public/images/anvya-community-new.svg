<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">ANVYA Community — Where Ideas Meet Opportunity</title>
<desc id="desc">A bright modern community banner showing five young people collaborating, idea and opportunity cards, and AI, SEO, Technology, Travel, Science, Economics and Business categories.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef7ff"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#f6efff"/></linearGradient>
  <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#1677ff"/><stop offset=".55" stop-color="#4f46e5"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#3157a5" flood-opacity=".18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="32"/></filter>
</defs>
<rect width="1536" height="1024" fill="url(#bg)"/>
<circle cx="130" cy="130" r="170" fill="#60a5fa" opacity=".18" filter="url(#soft)"/>
<circle cx="1400" cy="160" r="190" fill="#c084fc" opacity=".16" filter="url(#soft)"/>
<rect x="44" y="44" width="1448" height="936" rx="42" fill="#fff" opacity=".55" stroke="#dbeafe" stroke-width="3"/>
<text x="768" y="138" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="76" font-weight="900" fill="url(#brand)">ANVYA</text>
<text x="768" y="215" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="900" fill="#111827">Community</text>
<text x="768" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#2563eb">Where Ideas Meet <tspan fill="#9333ea">Opportunity.</tspan></text>
<path d="M635 291 Q768 320 901 291" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>

