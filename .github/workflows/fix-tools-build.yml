name: Fix tools build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix unterminated NLP string
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/PublicToolsLab.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'all those”.split(" ")'
          new = 'all those".split(" ")'
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
              print('Fixed malformed quote in NLP stop-word list.')
          else:
              print('No malformed quote found; nothing to change.')
          PY

      - name: Commit fix
        run: |
          if git diff --quiet -- src/components/PublicToolsLab.tsx; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PublicToolsLab.tsx
          git commit -m 'fix: repair NLP analyzer build syntax'
          git push
