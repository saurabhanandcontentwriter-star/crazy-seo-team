name: Crazy SEO Team News Refresh

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh live news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEWS_CRON_SECRET: ${{ secrets.NEWS_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "SUPABASE_URL GitHub Actions secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${NEWS_CRON_SECRET:-}" ]; then
            echo "NEWS_CRON_SECRET GitHub Actions secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "${SUPABASE_URL%/}/functions/v1/refresh-news" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $NEWS_CRON_SECRET" \
            --data '{"scheduled":true,"source":"github-actions"}'