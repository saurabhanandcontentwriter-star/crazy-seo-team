name: Crazy SEO Team News Refresh

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh live news
        env:
          GITHUB_ACTION_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "https://jeqzgtmovougiuegrjur.supabase.co/functions/v1/refresh-news" \
            -H "Content-Type: application/json" \
            -H "x-github-token: $GITHUB_ACTION_TOKEN" \
            --data '{"scheduled":true,"source":"github-actions"}'