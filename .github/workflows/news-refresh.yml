name: Crazy SEO Team News Refresh

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub OIDC token
        id: oidc
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crazy-seo-team"
          OIDC_TOKEN="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${TOKEN_URL}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "token=$OIDC_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Refresh live news
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "https://jeqzgtmovougiuegrjur.supabase.co/functions/v1/refresh-news" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            --data '{"scheduled":true,"source":"github-actions"}'