name: Verify production build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Create lockfile when missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          fi

      - name: Commit generated lockfile
        if: success()
        run: |
          if [ -f package-lock.json ] && ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add npm lockfile for reliable Vercel builds"
            git push
          fi

      - name: Production build
        run: npm run build
