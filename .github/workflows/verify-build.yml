name: Verify production build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Create lockfile when missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          fi

      - name: Commit generated lockfile
        if: success()
        run: |
          if [ -f package-lock.json ] && ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add npm lockfile for reliable Vercel builds"
            git push
          fi

      - name: Repair PublicToolsLab syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/components/PublicToolsLab.tsx")
          text = path.read_text(encoding="utf-8")
          fixed = text.replace('each”.split(" ")', 'each".split(" ")')
          if fixed == text:
            raise SystemExit("Expected PublicToolsLab syntax issue was not found")
          path.write_text(fixed, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/PublicToolsLab.tsx
          git commit -m "fix: repair PublicToolsLab string syntax"
          git push

      - name: Production build
        run: npm run build
