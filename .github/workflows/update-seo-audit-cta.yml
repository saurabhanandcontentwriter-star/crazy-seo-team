name: Update SEO Audit CTA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-cta:
    if: github.event.head_commit.message == 'Update SEO Audit CTA button'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace SEO Audit CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/SEOToolsSection.tsx')
          s = p.read_text(encoding='utf-8')
          old = "Get Full Report — It's Free"
          new = "Talk to Our Team"
          if old not in s:
              raise SystemExit('Target CTA text not found; no change made.')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-seo-audit-cta.yml
          git add src/components/SEOToolsSection.tsx .github/workflows/update-seo-audit-cta.yml
          git commit -m "Update SEO Audit CTA button"
          git push
