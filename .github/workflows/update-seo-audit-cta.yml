name: Update SEO Audit CTA

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-cta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace SEO Audit CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/SEOToolsSection.tsx')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("Get Full Report — It's Free", "Talk to Our Team"),
              ("Get Full Report — Talk to Our Team", "Talk to Our Team"),
          ]
          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if not changed:
              raise SystemExit('Target SEO Audit CTA text not found; no change made.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-seo-audit-cta.yml
          git add src/components/SEOToolsSection.tsx .github/workflows/update-seo-audit-cta.yml
          git commit -m "Update SEO Audit CTA button"
          git push
