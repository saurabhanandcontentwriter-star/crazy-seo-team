name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Supabase deploy credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN GitHub secret is missing. Add it in Settings → Secrets and variables → Actions."; exit 1
          fi

      - name: Apply canonical ANVYA post migration
        env:
          SUPABASE_ACCESS_TOKEN: \${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          ref = "pbkyoszlgyhpygofemij"
          sql = r"""do $
declare
  target_user uuid;
  target_profile text;
begin
  select p.user_id, p.public_id into target_user, target_profile
  from public.idea_profiles p
  where p.public_id = 'CST-76A57C84E0' limit 1;
  if target_user is null then
    raise exception 'ANVYA profile CST-76A57C84E0 not found';
  end if;
  update public.idea_posts
  set user_id=target_user,
      profile_id=coalesce(target_profile,'CST-76A57C84E0'),
      display_name='Saurabh Anand',
      title='Google September 2026 Spam Update: SEO Impact & What to Do',
      post_type='blog', visibility='public', status='approved',
      slug='google-september-2026-spam-update',
      tags=array['Google SEO','Spam Update','SEO']
  where slug='google-september-2026-spam-update'
     or lower(trim(title))=lower('Google September 2026 Spam Update: What SEO Professionals Need to Know');
  if not found then
    insert into public.idea_posts(user_id,profile_id,display_name,title,content,post_type,visibility,status,slug,tags)
    values(target_user,coalesce(target_profile,'CST-76A57C84E0'),'Saurabh Anand',
      'Google September 2026 Spam Update: SEO Impact & What to Do',
      '<p>Google''s September 2026 Spam Update is a reminder that sustainable SEO depends on useful content, technical quality, and a site that genuinely serves its audience.</p>',
      'blog','public','approved','google-september-2026-spam-update',array['Google SEO','Spam Update','SEO']);
  end if;
end $;"""
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{ref}/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={"Authorization": "Bearer "+os.environ["SUPABASE_ACCESS_TOKEN"], "Content-Type":"application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(req) as r:
                  print(r.read().decode())
          except urllib.error.HTTPError as e:
              print(e.read().decode(), flush=True)
              raise
          PY

      - name: Deploy CRM Ideas function
        run: supabase functions deploy crm-ideas-users --project-ref pbkyoszlgyhpygofemij
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
