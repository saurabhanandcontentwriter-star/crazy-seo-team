name: Deploy Supabase Edge Functions

# Normalize the PAT before every CLI call so pasted whitespace cannot break authentication.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: pbkyoszlgyhpygofemij

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Supabase deploy credentials
        id: credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '\r\n\t ')"
          if [ -z "${TOKEN:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN is not configured."
            exit 0
          fi
          if ! printf '%s' "$TOKEN" | grep -Eq '^sbp_(oauth_)?[a-f0-9]{40}$'; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not a valid Supabase PAT format. Generate a Personal Access Token from Supabase Account > Access Tokens. Do not use sb_publishable_ or sb_secret_ keys."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy LinkedIn Automation function
        if: steps.credentials.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "${SUPABASE_ACCESS_TOKEN}" | tr -d '\r\n\t ')"
          supabase functions deploy linkedin-automation \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Deploy CRM Ideas function
        if: steps.credentials.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "${SUPABASE_ACCESS_TOKEN}" | tr -d '\r\n\t ')"
          supabase functions deploy crm-ideas-users \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Check optional database password
        id: db_password
        if: steps.credentials.outputs.configured == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply Supabase migrations
        if: steps.credentials.outputs.configured == 'true' && steps.db_password.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "${SUPABASE_ACCESS_TOKEN}" | tr -d '\r\n\t ')"
          supabase db push \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --include-all

      - name: Deploy AI Customer Discovery function
        if: steps.credentials.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          export SUPABASE_ACCESS_TOKEN="$(printf '%s' "${SUPABASE_ACCESS_TOKEN}" | tr -d '\r\n\t ')"
          supabase functions deploy ai-customer-discovery \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --no-verify-jwt

      - name: Deployment skipped
        if: steps.credentials.outputs.configured != 'true'
        run: |
          echo "Supabase deployment skipped because SUPABASE_ACCESS_TOKEN is not configured."
