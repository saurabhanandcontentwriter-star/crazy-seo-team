name: Deploy Supabase Edge Functions

# Use the Supabase Management API for Edge Function deployment.
# This avoids the CLI's legacy PAT-format validation and accepts current scoped sbp_ tokens.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: pbkyoszlgyhpygofemij

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Supabase deploy credentials
        id: credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          TOKEN="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '\r\n\t ')"
          if [ -z "${TOKEN:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN is not configured."
            exit 0
          fi
          # Let Supabase validate the token itself; current PAT formats can vary.
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy LinkedIn Automation function
        if: steps.credentials.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '\r\n\t ')"
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(
            curl --silent --show-error --location \
              --output "$RESPONSE_FILE" --write-out '%{http_code}' \
              --request POST \
              --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/functions/deploy?slug=linkedin-automation" \
              --header "Authorization: Bearer $TOKEN" \
              --form 'metadata={"entrypoint_path":"index.ts","name":"linkedin-automation","verify_jwt":false};type=application/json' \
              --form 'file=@supabase/functions/linkedin-automation/index.ts;type=text/plain'
          )"
          cat "$RESPONSE_FILE"
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::LinkedIn function deployment failed with HTTP $HTTP_CODE."
            exit 1
          fi

      - name: Deploy CRM Ideas function
        if: steps.credentials.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '\r\n\t ')"
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(
            curl --silent --show-error --location \
              --output "$RESPONSE_FILE" --write-out '%{http_code}' \
              --request POST \
              --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/functions/deploy?slug=crm-ideas-users" \
              --header "Authorization: Bearer $TOKEN" \
              --form 'metadata={"entrypoint_path":"index.ts","name":"crm-ideas-users","verify_jwt":false};type=application/json' \
              --form 'file=@supabase/functions/crm-ideas-users/index.ts;type=text/plain'
          )"
          cat "$RESPONSE_FILE"
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::CRM function deployment failed with HTTP $HTTP_CODE."
            exit 1
          fi

      - name: Check optional database password
        id: db_password
        if: steps.credentials.outputs.configured == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_DB_PASSWORD is not configured; database migrations are not applied by this workflow."
          fi

      - name: Apply Supabase migrations
        if: steps.credentials.outputs.configured == 'true' && steps.db_password.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          npx --yes supabase@latest db push \
            --project-ref "${SUPABASE_PROJECT_REF}" \
            --include-all

      - name: Deploy AI Customer Discovery function
        if: steps.credentials.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '\r\n\t ')"
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(
            curl --silent --show-error --location \
              --output "$RESPONSE_FILE" --write-out '%{http_code}' \
              --request POST \
              --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/functions/deploy?slug=ai-customer-discovery" \
              --header "Authorization: Bearer $TOKEN" \
              --form 'metadata={"entrypoint_path":"index.ts","name":"ai-customer-discovery","verify_jwt":false};type=application/json' \
              --form 'file=@supabase/functions/ai-customer-discovery/index.ts;type=text/plain'
          )"
          cat "$RESPONSE_FILE"
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::AI Customer Discovery deployment failed with HTTP $HTTP_CODE."
            exit 1
          fi

      - name: Deployment skipped
        if: steps.credentials.outputs.configured != 'true'
        run: |
          echo "Supabase deployment skipped because SUPABASE_ACCESS_TOKEN is not configured."
